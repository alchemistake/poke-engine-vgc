[package]
name = "poke-engine"
version = "0.0.48"
authors = ["pmariglia <pmariglia@github.com>"]
edition = "2018"
license-file = "LICENSE"
description = "A Pokemon battle engine that can be used to search through the state space of a Pokemon battle."

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "poke-engine"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "data/benchmark.rs"

[[bin]]
name = "bench-doubles"
path = "bench/bench_doubles.rs"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[dependencies]
arrayvec = "0.7"
smallvec = "1"
dashmap = "6.1.0"
clap = { version = "4.5.4", features = ["derive"] }
rand = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
remove_low_chance_instructions = []
gen1 = []
gen2 = []
gen3 = []
gen4 = []
gen5 = []
gen6 = []
gen7 = []
gen8 = []
gen9 = []
champions = []
bss = ["champions"]
terastallization = ["gen9"]

default = []

[workspace]
members = [
    "poke-engine-py"
]

[target.wasm32-unknown-unknown.dependencies]
web-time = "1.1.0"
