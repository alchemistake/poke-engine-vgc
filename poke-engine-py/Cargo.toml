[package]
name = "poke_engine"
edition = "2021"
version = "0.0.48"

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
poke-engine = { path = "../" }
serde_json = "1.0"
pythonize = "0.29.0"

[features]
default = ["poke-engine/gen4"]
# Doubles engine (gen9championsvgc2026regmc). Build with
# `--no-default-features --features champions`.
champions = ["poke-engine/champions"]
